<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PassDrop</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; font-family: 'Space Grotesk', sans-serif; }
  #root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="android-frame.jsx"></script>
<script type="text/babel" src="passDrop-cards.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { PASS_DATA, CardStack, CardDetail } = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "tab0": "Gift Cards",
  "tab1": "Transport",
  "tab2": "Coupons",
  "tab3": "Loyalty",
  "colorGC1": "#3d5248",
  "colorGC2": "#4a3629",
  "colorGC3": "#2e3542",
  "colorTR1": "#2b3e52",
  "colorTR2": "#2e4a3a",
  "colorCP1": "#4a2e35",
  "colorCP2": "#3a3520",
  "colorLY1": "#3e2e1e",
  "colorLY2": "#3a2638"
}/*EDITMODE-END*/;

const CARD_COLOR_KEYS = ["colorGC1","colorGC2","colorGC3","colorTR1","colorTR2","colorCP1","colorCP2","colorLY1","colorLY2"];

function PassDropApp() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const { TweaksPanel, TweakSection, TweakText, TweakColor } = window;

  const CATEGORIES = [tweaks.tab0, tweaks.tab1, tweaks.tab2, tweaks.tab3];
  const [activeTab, setActiveTab] = useState(0);
  const [selectedPass, setSelectedPass] = useState(null);
  const [passes, setPasses] = useState(PASS_DATA);

  // Assign color overrides per card id
  const colorMap = {};
  passes.forEach((p, i) => { colorMap[p.id] = tweaks[CARD_COLOR_KEYS[i]] || undefined; });

  const filtered = passes.filter(p => p.category === CATEGORIES[activeTab]);

  const handleUpdate = (id, fields) => {
    setPasses(prev => prev.map(p => p.id === id ? { ...p, ...fields } : p));
    if (selectedPass && selectedPass.id === id) setSelectedPass(prev => ({ ...prev, ...fields }));
  };

  // When tweaks change category name that current tab maps to, keep index
  const activeCategory = CATEGORIES[activeTab];

  return (
    <div style={{ width: "100%", height: "100%", background: "#0a0a0c", display: "flex", alignItems: "center", justifyContent: "center", position: "relative" }}>
      <AndroidDevice dark={true}>
        {/* App content */}
        <div style={{
          width: "100%", height: "100%",
          background: "oklch(10% 0.008 250)",
          display: "flex", flexDirection: "column",
          overflow: "hidden",
          position: "relative",
        }}>
          {/* Header */}
          <div style={{ padding: "20px 24px 0", flexShrink: 0 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
              <div>
                <div style={{ color: "rgba(255,255,255,0.35)", fontSize: 11, letterSpacing: "0.18em", textTransform: "uppercase", fontWeight: 500, marginBottom: 2 }}>
                  Your wallet
                </div>
                <div style={{ color: "#fff", fontSize: 26, fontWeight: 700, letterSpacing: "-0.04em", lineHeight: 1 }}>
                  PassDrop
                </div>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button
                  style={{
                    width: 40, height: 40, borderRadius: 13,
                    background: "rgba(255,255,255,0.06)",
                    border: "none", cursor: "pointer",
                    display: "flex", alignItems: "center", justifyContent: "center",
                  }}
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" strokeWidth="2" strokeLinecap="round">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                  </svg>
                </button>
                <button
                  style={{
                    width: 40, height: 40, borderRadius: 13,
                    background: "rgba(255,255,255,0.06)",
                    border: "none", cursor: "pointer",
                    display: "flex", alignItems: "center", justifyContent: "center",
                  }}
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" strokeWidth="2" strokeLinecap="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                  </svg>
                </button>
              </div>
            </div>

            {/* Category tabs */}
            <div style={{
              display: "flex", gap: 6,
              overflowX: "auto", paddingBottom: 4,
              scrollbarWidth: "none",
            }}>
              {CATEGORIES.map((cat, i) => {
                const count = PASS_DATA.filter(p => p.category === cat).length;
                const active = i === activeTab;
                return (
                  <button
                    key={i}
                    onClick={() => setActiveTab(i)}
                    style={{
                      flexShrink: 0,
                      padding: "8px 14px",
                      borderRadius: 20,
                      border: "none",
                      background: active ? "#fff" : "rgba(255,255,255,0.07)",
                      color: active ? "#0a0a0c" : "rgba(255,255,255,0.5)",
                      fontSize: 13,
                      fontWeight: active ? 600 : 400,
                      cursor: "pointer",
                      fontFamily: "inherit",
                      letterSpacing: "-0.01em",
                      transition: "all 0.2s ease",
                      display: "flex", alignItems: "center", gap: 5,
                    }}
                  >
                    {cat}
                    <span style={{
                      background: active ? "rgba(0,0,0,0.12)" : "rgba(255,255,255,0.1)",
                      color: active ? "#000" : "rgba(255,255,255,0.4)",
                      borderRadius: 8, padding: "1px 6px",
                      fontSize: 11, fontWeight: 600,
                    }}>
                      {count}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>

          {/* Divider */}
          <div style={{ height: 1, background: "rgba(255,255,255,0.05)", margin: "16px 0 0" }} />

          {/* Card stack */}
          <div style={{ flex: 1, overflowY: "auto", padding: "20px 20px 100px" }}>
            <CardStack
              cards={filtered}
              colorMap={colorMap}
              onTap={setSelectedPass}
            />
          </div>

          {/* FAB — scan */}
          <div style={{
            position: "absolute", bottom: 24, right: 20,
            display: "flex", alignItems: "center", gap: 10,
          }}>
            <div style={{
              background: "oklch(14% 0.01 250)",
              border: "1px solid rgba(255,255,255,0.08)",
              borderRadius: 16,
              padding: "10px 16px",
              color: "rgba(255,255,255,0.5)",
              fontSize: 12,
              fontWeight: 500,
              letterSpacing: "0.02em",
            }}>
              Add pass
            </div>
            <button
              style={{
                width: 56, height: 56, borderRadius: 18,
                background: "#fff",
                border: "none", cursor: "pointer",
                display: "flex", alignItems: "center", justifyContent: "center",
                boxShadow: "0 8px 24px rgba(0,0,0,0.5)",
              }}
            >
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a0a0c" strokeWidth="2.5" strokeLinecap="round">
                <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
                <rect x="8" y="8" width="8" height="8" rx="1"/>
              </svg>
            </button>
          </div>

          {/* Card detail modal */}
          {selectedPass && (
            <CardDetail
              pass={selectedPass}
              colorOverride={colorMap[selectedPass.id]}
              onClose={() => setSelectedPass(null)}
              onUpdate={handleUpdate}
            />
          )}
        </div>
      </AndroidDevice>

      {/* Tweaks panel */}
      <TweaksPanel>
        <TweakSection title="Categories">
          <TweakText id="tab0" label="Tab 1" />
          <TweakText id="tab1" label="Tab 2" />
          <TweakText id="tab2" label="Tab 3" />
          <TweakText id="tab3" label="Tab 4" />
        </TweakSection>
        <TweakSection title="Gift Card Colors">
          <TweakColor id="colorGC1" label="Starbucks" />
          <TweakColor id="colorGC2" label="Amazon" />
          <TweakColor id="colorGC3" label="Nike" />
        </TweakSection>
        <TweakSection title="Transport Colors">
          <TweakColor id="colorTR1" label="City Metro" />
          <TweakColor id="colorTR2" label="FlixBus" />
        </TweakSection>
        <TweakSection title="Coupon Colors">
          <TweakColor id="colorCP1" label="H&M" />
          <TweakColor id="colorCP2" label="Subway" />
        </TweakSection>
        <TweakSection title="Loyalty Colors">
          <TweakColor id="colorLY1" label="Coffee Club" />
          <TweakColor id="colorLY2" label="Sephora" />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PassDropApp />);
</script>
</body>
</html>
